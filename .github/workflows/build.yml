name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Gradle Wrapper
      run: gradle wrapper

    - name: Make Wrapper Executable
      run: chmod +x gradlew

    - name: Build Universal Debug APK
      run: ./gradlew assembleDebug

    - name: Rename APK for Release
      run: |
        mkdir -p release_output
        cp app/build/outputs/apk/debug/app-debug.apk release_output/Atmo-Universal-v0.8.0.apk

    - name: Upload Artifact (Workflow Run)
      uses: actions/upload-artifact@v4
      with:
        name: Atmo-Universal-v0.8.0
        path: release_output/Atmo-Universal-v0.8.0.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: release_output/Atmo-Universal-v0.8.0.apk
        name: "Atmo Universal Release ${{ github.ref_name }}"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
